<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Teste de envio</title>
<style>
  body { margin: 0; background: #0d0d10; color: #eee; font: 18px system-ui, sans-serif; }
  .box { max-width: 460px; margin: 0 auto; padding: 24px 18px; }
  h2 { font-weight: 600; margin: 0 0 16px; font-size: 20px; }
  label { display: block; color: #999; font-size: 14px; margin: 14px 0 6px; }
  input { width: 100%; box-sizing: border-box; padding: 12px; font-size: 18px; background: #1c1c20; color: #fff; border: 1px solid #333; border-radius: 10px; }
  #hora { font-size: 44px; text-align: center; letter-spacing: 2px; padding: 14px; }
  button { width: 100%; margin-top: 16px; padding: 16px; font-size: 20px; border: 0; border-radius: 12px; background: #2d6cdf; color: #fff; }
  #st { margin-top: 18px; padding: 12px; border-radius: 10px; background: #18181b; min-height: 48px; white-space: pre-wrap; font-size: 16px; }
  .ok { color: #6d6; } .bad { color: #e66; } .wait { color: #db6; }
  details { margin-top: 22px; color: #aaa; }
</style>
</head>
<body><div class="box">
  <h2>Teste de envio da hora</h2>
  <input id="hora" inputmode="numeric" placeholder="8:13" autocomplete="off">
  <button id="go">Enviar</button>
  <div id="st">Conectando…</div>
  <details id="det"><summary>Chave e canal</summary>
    <label>Chave do Ably</label><input id="key" type="password" autocomplete="off">
    <label>Canal</label><input id="ch" autocomplete="off">
    <button id="save" style="background:#333">Salvar</button>
  </details>
</div>
<script src="ably.min.js"></script>
<script>
'use strict';
const LS = 'interestelar_envio_v1', $ = id => document.getElementById(id);
const Q = new URLSearchParams(location.search);
const cfg = Object.assign({ key: '-WkBxA.FUModg:DGe6U1wyeEuOu4_3iuubjnS144Ol3ojOlTb9mmqgmv0', ch: 'interestelar' }, JSON.parse(localStorage.getItem(LS) || '{}'));
if (!cfg.key) cfg.key = '-WkBxA.FUModg:DGe6U1wyeEuOu4_3iuubjnS144Ol3ojOlTb9mmqgmv0';
if (Q.get('key')) cfg.key = Q.get('key'); if (Q.get('canal')) cfg.ch = Q.get('canal');
localStorage.setItem(LS, JSON.stringify(cfg));
$('key').value = cfg.key; $('ch').value = cfg.ch;
let ably = null, chan = null, lastId = null, sentAt = 0;
function st(t, cls) { $('st').textContent = t; $('st').className = cls || ''; }
function connect() {
  try { if (ably) ably.close(); } catch (e) {}
  if (typeof Ably === 'undefined') { st('Sem internet para o Ably.', 'bad'); return; }
  if (!cfg.key) { st('Coloque a chave do Ably em "Chave e canal".', 'bad'); $('det').open = true; return; }
  ably = new Ably.Realtime({ key: cfg.key, clientId: 'teste-envio', echoMessages: false });
  ably.connection.on(s => { if (s.current === 'connected') st('Conectado. Digite a hora e envie.', 'ok'); else if (s.current !== 'connecting') st('Ably: ' + s.current, 'bad'); });
  chan = ably.channels.get(cfg.ch);
  chan.subscribe('recebido', m => {
    const d = m.data || {}; if (lastId && d.id && d.id !== lastId) return;
    const ms = sentAt ? ' (' + (Date.now() - sentAt) + ' ms)' : '';
    const txt = { recebida: 'Player recebeu ' + d.hora + ms + '. Preparando…', pronto: 'Pronto no player: ' + d.pronta + ms,
      ignorada: 'Chegou tarde: o close já começou. Fica ' + d.pronta, tarde: 'Ficou pronta tarde demais. Vai aparecer ' + d.pronta }[d.status] || JSON.stringify(d);
    st(txt, d.status === 'pronto' ? 'ok' : d.status === 'recebida' ? 'wait' : 'bad');
    if (navigator.vibrate) navigator.vibrate(d.status === 'pronto' ? [60, 80, 60] : 30);
  });
}
$('go').onclick = () => {
  const h = $('hora').value.trim(); if (!h) return;
  if (!chan) { st('Ainda não conectado.', 'bad'); return; }
  lastId = Math.random().toString(36).slice(2, 8); sentAt = Date.now();
  st('Enviando ' + h + '…', 'wait');
  chan.publish('hora', { hora: h, id: lastId, de: 'teste' }).catch(e => st('Erro ao enviar: ' + e.message, 'bad'));
};
$('hora').addEventListener('keydown', e => { if (e.key === 'Enter') $('go').onclick(); });
$('save').onclick = () => { cfg.key = $('key').value.trim(); cfg.ch = $('ch').value.trim() || 'interestelar'; localStorage.setItem(LS, JSON.stringify(cfg)); $('det').open = false; connect(); };
connect();
</script>
</body>
</html>
